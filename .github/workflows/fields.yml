# Builds the global forecast fields and publishes them to the `data` branch, which the app reads.
# A build only runs when a new WAFS issue or model run (GFS, ECMWF IFS, ECMWF AIFS) is out, so most runs take a few seconds.
# GitHub often runs the hourly schedule only every few hours, so each run also queues the next check itself, ~30 min on
# (last step). To stop the loop, disable this workflow in the Actions tab.
name: Forecast fields

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if no new forecasts are out
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to queue the next run

# At most one run going and one waiting: a newer waiting run cancels an older one, so the self-queued runs and the
# schedule can't pile up into parallel loops.
concurrency:
  group: forecast-fields
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Fetch the previous build
        run: |
          if git clone -q --depth 1 --branch data "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out_prev; then
            rm -rf out_prev/.git
          else
            mkdir -p out_prev
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: python -m pipeline.fields
        env:
          TW_FORCE: ${{ inputs.force && '1' || '0' }}

      - name: Publish to the data branch
        run: |
          if [ -f out/.unchanged ]; then echo "No new forecasts; nothing to publish."; exit 0; fi
          cd out
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json   # keep Vercel from deploying data commits
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast fields $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "Published $(ls | wc -l) files, $(du -sh . | cut -f1)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs after a failed build too (a flaky download shouldn't end the loop), but not after a cancel.
      - name: Queue the next check in ~25 min
        if: ${{ !cancelled() }}
        run: |
          sleep 1500
          gh workflow run fields.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
